<div class="h-1 w-8 rounded-full bg-primary-container"></div>
<div class="h-1 w-8 rounded-full bg-primary-container"></div>

<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl p-stack-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-sand-border">
<div class="mb-stack-xl text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-xs">How do you live?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Help us find flatmates with a similar vibe.</p>
</div>
<!-- Lifestyle Choices -->
<div class="space-y-stack-lg mb-stack-xl">
<!-- Social Vibe -->
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">group</span>
                        Social Vibe
                    </h3>
<div class="flex flex-wrap gap-stack-sm">
<button class="px-4 py-2 rounded-full border border-sand-border font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">Quiet &amp; Independent</button>
<button class="px-4 py-2 rounded-full border border-primary bg-primary-container/10 font-label-md text-label-md text-primary transition-colors">Friendly &amp; Chatty</button>
<button class="px-4 py-2 rounded-full border border-sand-border font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">Party Animals</button>
</div>
</div>

<h3 class="font-title-md text-title-md text-on-surface mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">cleaning_services</span>

<div class="flex flex-wrap gap-stack-sm">
<button class="px-4 py-2 rounded-full border border-sand-border font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">Relaxed</button>
<button class="px-4 py-2 rounded-full border border-sand-border font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">Neat</button>
<button class="px-4 py-2 rounded-full border border-primary bg-primary-container/10 font-label-md text-label-md text-primary transition-colors">Spotless</button>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[18px]">arrow_back</span>
