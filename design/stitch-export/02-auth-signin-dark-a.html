<body class="bg-deep-void text-inverse-on-surface h-screen flex items-center justify-center p-4">
<!-- Ambient Background Texture -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.1) 0%, transparent 50%);"></div>
<!-- Centered Card -->
<div class="relative z-10 w-full max-w-md bg-onyx rounded-[24px] shadow-2xl p-8 sm:p-10 flex flex-col gap-stack-lg border border-outline/20">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-electric-cyan font-bold tracking-tight">Homley</h1>
<p class="font-body-md text-body-md text-surface-dim">Welcome back. Enter your details to continue to Premium Living.</p>
</div>
<!-- Toggle (Email / Phone) -->
<div class="flex bg-inverse-surface rounded-full p-1 shadow-inner mt-4">
<button class="flex-1 font-label-md text-label-md py-2 rounded-full bg-onyx text-electric-cyan shadow-sm transition-all text-center">Email</button>
<button class="flex-1 font-label-md text-label-md py-2 rounded-full text-surface-dim hover:text-white transition-all text-center">Phone</button>
</div>
<!-- Form Area -->
<div class="flex flex-col gap-stack-md mt-2">
<!-- Email Input -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-surface-dim" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-deep-void border border-outline/30 rounded-xl py-3 pl-12 pr-4 font-body-md text-body-md text-white placeholder-outline focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" id="email" placeholder="hello@example.com" type="email"/>
</div>
</div>
<!-- OTP Input (Mocked as single input for layout, typically split) -->
<div class="flex flex-col gap-stack-xs mt-2">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-surface-dim">Verification Code (OTP)</label>
<button class="font-label-md text-label-md text-electric-cyan hover:text-white transition-colors">Send Code</button>
</div>
<div class="flex gap-2 justify-between">
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" placeholder="-" type="text"/>
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" placeholder="-" type="text"/>
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" placeholder="-" type="text"/>
<input class="w-12 h-14 bg-deep-void border border-outline/30 rounded-lg text-center font-title-md text-title-md text-white focus:outline-none focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan transition-colors" maxlength="1" placeholder="-" type="text"/>
</div>
</div>
<button class="w-full bg-electric-cyan text-deep-void font-title-md text-title-md font-bold py-3 rounded-xl mt-4 hover:bg-white transition-colors hover:scale-[0.98] transform duration-150 shadow-[0_4px_14px_0_rgba(34,211,238,0.39)]">Sign In</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-px bg-outline/20"></div>
<span class="font-label-md text-label-md text-surface-dim uppercase tracking-wider text-[11px]">Or continue with</span>
<div class="flex-1 h-px bg-outline/20"></div>
</div>

            Continue with Google
        </button>
<p class="text-center font-label-md text-label-md text-surface-dim mt-2">
            Don't have an account? <a class="text-electric-cyan hover:text-white transition-colors" href="#">Sign up</a>
</p>
</div>
