<!-- Scrollable Content Area -->

<script>
        // Simple script to handle chip toggling visually
        document.querySelectorAll('.chip-selectable').forEach(chip => {
            if(!chip.hasAttribute('onclick')){
                 chip.addEventListener('click', function() {
                    this.classList.toggle('chip-selected');
                    
                    // Toggle colors manually if class toggle isn't enough due to specific tailwind classes
                    if(this.classList.contains('chip-selected')) {
                        this.classList.remove('border-sand-border', 'bg-surface-container-lowest');
                        this.classList.add('border-petrol', 'bg-petrol');
                        this.querySelector('span.text-on-surface-variant').classList.replace('text-on-surface-variant', 'text-white');
                        this.querySelector('span.text-on-surface').classList.replace('text-on-surface', 'text-white');
                    } else {
                        this.classList.add('border-sand-border', 'bg-surface-container-lowest');
                        this.classList.remove('border-petrol', 'bg-petrol');
                        this.querySelector('span.text-white:first-child').classList.replace('text-white', 'text-on-surface-variant');
                        this.querySelector('span.text-white').classList.replace('text-white', 'text-on-surface');
                    }
                });
            }
        });
    </script>
