<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Homley - Listing Creation Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#1c1c18",
                        "primary-fixed-dim": "#81d1f0",
                        "on-surface": "#1b1c1a",
                        "sand-border": "#DFDCD6",
                        "electric-cyan": "#22D3EE",
                        "inverse-on-surface": "#f2f0ed",
                        "secondary": "#5e5e5d",
                        "on-secondary-fixed-variant": "#464746",
                        "on-surface-variant": "#3f484c",
                        "on-error": "#ffffff",
                        "surface-bright": "#fbf9f6",
                        "tertiary-fixed-dim": "#c9c6c0",
                        "onyx": "#1D262B",
                        "surface-tint": "#006781",
                        "on-background": "#1b1c1a",
                        "surface": "#fbf9f6",
                        "secondary-fixed": "#e4e2e1",
                        "on-primary-fixed-variant": "#004d62",
                        "on-secondary-container": "#636362",
                        "on-error-container": "#93000a",
                        "background": "#fbf9f6",
                        "on-primary-fixed": "#001f29",
                        "surface-container-high": "#eae8e5",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#d3f1ff",
                        "outline-variant": "#bec8cd",
                        "outline": "#6f787d",
                        "inverse-primary": "#81d1f0",
                        "petrol": "#0E7490",
                        "inverse-surface": "#30312f",
                        "surface-variant": "#e4e2df",
                        "deep-void": "#0B1114",
                        "on-tertiary-container": "#f0ece6",
                        "surface-container-low": "#f5f3f0",
                        "surface-container-highest": "#e4e2df",
                        "tertiary-container": "#6c6b66",
                        "primary-container": "#0e7490",
                        "secondary-container": "#e1dfde",
                        "sand-light": "#F7F5F2",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#1b1c1b",
                        "surface-dim": "#dbdad7",
                        "surface-container": "#efeeeb",
                        "tertiary-fixed": "#e5e2dc",
                        "tertiary": "#54534e",
                        "primary": "#005a71",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#c7c6c5",
                        "primary-fixed": "#b9eaff",
                        "on-tertiary-fixed-variant": "#484742",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "80px",
                        "stack-sm": "8px",
                        "stack-xl": "48px",
                        "stack-xs": "4px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-deep-void text-on-tertiary-container min-h-screen font-body-md selection:bg-petrol selection:text-on-primary">
<!-- Navbar: Suppressed because this is a transactional flow (Listing Creation Wizard) -->
<main class="max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-stack-xl flex flex-col gap-stack-xl">
<!-- Header & Progress -->
<header class="flex flex-col gap-stack-lg">
<div class="flex items-center justify-between">
<a class="text-secondary-fixed-dim hover:text-electric-cyan transition-colors flex items-center gap-stack-xs group" href="#">
<span aria-hidden="true" class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-label-md text-label-md">Back</span>
</a>
<div class="flex items-center gap-stack-xs text-petrol">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span class="font-label-md text-label-md">Saved</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-electric-cyan">Where is your place located?</h1>
<p class="font-body-lg text-body-lg text-secondary-fixed-dim">We only show an approximate circle publicly — exact address is private.</p>
</div>
<!-- Progress Rail -->
<div class="flex gap-stack-xs h-1 w-full mt-stack-md">
<div class="h-full bg-petrol rounded-full flex-1"></div>
<div class="h-full bg-petrol rounded-full flex-1"></div>
<div class="h-full bg-onyx rounded-full flex-1"></div>
<div class="h-full bg-onyx rounded-full flex-1"></div>
<div class="h-full bg-onyx rounded-full flex-1"></div>
</div>
</header>
<!-- Form Area -->
<form class="flex flex-col gap-stack-lg bg-onyx p-stack-lg md:p-stack-xl rounded-xl border border-outline-variant/20 shadow-lg relative overflow-hidden group/form">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Country -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-secondary-fixed-dim" for="country">Country/Region</label>
<div class="relative">
<select class="w-full bg-deep-void border border-outline-variant/30 text-on-tertiary-container font-body-md text-body-md rounded-lg px-4 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-petrol focus:border-transparent transition-all" id="country">
<option>India</option>
<option>United States</option>
<option>United Kingdom</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-secondary-fixed-dim pointer-events-none">expand_more</span>
</div>
</div>
<!-- City -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-secondary-fixed-dim" for="city">City</label>
<input class="w-full bg-deep-void border border-outline-variant/30 text-on-tertiary-container font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-petrol focus:border-transparent transition-all" id="city" type="text" value="Mumbai"/>
</div>
</div>
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-secondary-fixed-dim" for="street">Street address</label>
<input class="w-full bg-deep-void border border-outline-variant/30 text-on-tertiary-container font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-petrol focus:border-transparent transition-all" id="street" placeholder="House number and street name" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-secondary-fixed-dim" for="apt">Apt, suite, etc. (Optional)</label>
<input class="w-full bg-deep-void border border-outline-variant/30 text-on-tertiary-container font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-petrol focus:border-transparent transition-all" id="apt" placeholder="e.g. Apt 4B" type="text"/>
</div>
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-secondary-fixed-dim" for="zip">Postal code</label>
<input class="w-full bg-deep-void border border-outline-variant/30 text-on-tertiary-container font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-petrol focus:border-transparent transition-all" id="zip" placeholder="e.g. 400001" type="text"/>
</div>
</div>
<!-- Map Placeholder Area -->
<div class="mt-stack-md rounded-xl overflow-hidden relative h-64 border border-outline-variant/20 bg-deep-void group cursor-crosshair">
<img class="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity duration-500" data-alt="A stylized, dark-mode top-down map view of a modern coastal city, reminiscent of Mumbai. The map features a minimalist aesthetic with deep charcoal grays and blacks representing land and subtle glowing petrol-blue lines indicating major streets and coastlines. Soft, ambient lighting highlights a generalized circular area in the center. Professional UI map visualization style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHJ62dss209ZN9DSXMKMJhTiMZjLRgE8C5pSiwuYogcbcNRyIKhu45DycAlHrh0NO9cFbbjzFlmSAJxaOhU-E8FrK9QJBXO3ameYaG08Au8cC8ITpiXkHqIcQoasQSCvadMfN7sNmAtEt3f13DfcDHb4Wn7mZUg6A8_oRY6BNR9SLdMbAlEC1Nv2UxxKk8Hs6A111YYDzP4nv3VhPtM9lv1pLYR90ljj88hTGtWuFMt8iqFnvMo5ye6A"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-32 h-32 rounded-full border-2 border-electric-cyan/50 bg-electric-cyan/10 flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-electric-cyan text-4xl" data-weight="fill">location_on</span>
</div>
</div>
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end pointer-events-none">
<div class="bg-deep-void/80 backdrop-blur-md rounded-lg p-2 border border-outline-variant/30 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-fixed-dim text-[16px]">info</span>
<span class="font-label-md text-[12px] text-secondary-fixed-dim">Location is approximate</span>
</div>
<button class="pointer-events-auto bg-onyx hover:bg-deep-void text-on-tertiary-container font-label-md text-label-md rounded-lg px-3 py-2 border border-outline-variant/30 transition-colors flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">my_location</span>
                        Locate me
                    </button>
</div>
</div>
</form>
<!-- Footer Actions -->
<footer class="flex items-center justify-between pt-stack-md border-t border-onyx">
<button class="font-label-md text-label-md text-secondary-fixed-dim hover:text-on-tertiary-container transition-colors underline underline-offset-4" type="button">Skip for now</button>
<button class="bg-petrol hover:bg-electric-cyan hover:text-deep-void text-on-primary font-title-md text-title-md rounded-lg px-8 py-3 transition-all transform hover:scale-95 active:scale-90 shadow-md" type="button">
                Continue
            </button>
</footer>
</main>
</body></html>
