<body class="bg-pattern min-h-screen flex items-center justify-center font-body-md text-on-surface p-margin-mobile md:p-margin-desktop">
<!-- Note: Top NavBar and Bottom NavBar are suppressed for this transactional flow as per instructions -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl soft-pop-shadow p-stack-lg md:p-stack-xl flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Decorative element -->
<div class="absolute -top-12 -right-12 w-40 h-40 bg-surface-container rounded-full mix-blend-multiply opacity-50 blur-2xl pointer-events-none"></div>
<!-- Header -->
<header class="text-center flex flex-col items-center gap-stack-sm relative z-10">
<div class="w-12 h-12 bg-surface-container-low rounded-lg flex items-center justify-center mb-stack-sm whisper-shadow text-petrol">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">home_work</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to access your account.</p>
</header>
<!-- Toggle -->
<div class="bg-surface-container-low p-1 rounded-lg flex relative z-10">
<button aria-selected="true" class="flex-1 py-2 font-label-md text-label-md bg-surface-container-lowest text-on-surface rounded shadow-sm whisper-shadow transition-all">Email</button>
<button aria-selected="false" class="flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all">Phone</button>
</div>
<!-- Input Area (Email State) -->
<div class="flex flex-col gap-stack-md relative z-10">
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-sand-border rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- OTP Input (Visible after email entry, mocking flow) -->
<div class="flex flex-col gap-stack-xs mt-stack-sm hidden">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between">
<span>Verification Code</span>
<button class="text-petrol hover:text-primary transition-colors">Resend</button>
</label>
<div class="flex justify-between gap-2">
<input class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-sand-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-sand-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" maxlength="1" type="text" value="8"/>
<input autofocus="" class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-primary ring-2 ring-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow soft-pop-shadow" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-sand-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-sand-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-title-md text-title-md bg-surface-container-lowest border border-sand-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow whisper-shadow" maxlength="1" type="text"/>
</div>
</div>
<button class="w-full bg-petrol text-on-primary py-3 rounded-lg font-label-md text-label-md hover:bg-primary transition-all active:scale-95 shadow-sm mt-stack-xs flex justify-center items-center gap-2">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="flex items-center gap-4 relative z-10">
<div class="h-px bg-sand-border flex-1"></div>
<span class="font-label-md text-label-md text-outline">or</span>
<div class="h-px bg-sand-border flex-1"></div>
</div>

<div class="relative z-10">
<button class="w-full bg-surface-container-lowest border border-sand-border text-on-surface py-3 rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-all active:scale-95 whisper-shadow flex justify-center items-center gap-3">
<img alt="Google logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOK46QbN8sNucNtt_WmIHYSM56i8aP85PmtPyLUYQ-8zFTSX23p9NfPSZr6yRpxjY7FxhpInFc27X5vDo-0YKIk61Eb0XlRILOw7mHaY3LT2j6tJ29A46B5KglSaUo3Y3cVX0N3bAlSaq2LWXWMEdvXCdCmFNMrRDsw3N3v7szW_QY0KnfPWlkUxHbAMonfpVenAXcQXkiLFHi0hVzpT8k86IktIDj9vLrkAhl5gp2sTaElYDTXrQpAQ"/>
                Continue with Google
            </button>
</div>
<p class="text-center font-body-md text-body-md text-on-surface-variant relative z-10 mt-stack-sm">
            Don't have an account? <a class="text-petrol font-medium hover:underline" href="#">Sign up</a>
</p>
