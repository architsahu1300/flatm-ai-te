<style>
        /* Base Dark Theme Overrides for this specific screen */
        body {
            background-color: #0B1114; /* deep-void */
            color: #f2f0ed; /* inverse-on-surface */

            background-color: rgba(34, 211, 238, 0.15); /* electric-cyan low opacity */

<body class="min-h-screen flex flex-col font-body-md antialiased w-full max-w-[390px] mx-auto relative overflow-x-hidden">
<!-- Top Nav / Header area -->
<header class="flex justify-between items-center px-margin-mobile pt-12 pb-4">
<button aria-label="Go back" class="text-outline-variant hover:text-inverse-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<button class="font-label-md text-label-md text-outline-variant hover:text-inverse-on-surface transition-colors">
            Skip for now
        </button>
</header>
<!-- Progress Indicator -->
<div class="px-margin-mobile mb-stack-lg">
<div class="flex gap-1 h-1 w-full bg-onyx rounded-full overflow-hidden">
<div class="h-full bg-electric-cyan w-1/4 rounded-full"></div>
<div class="h-full bg-electric-cyan w-1/4 rounded-full"></div>
<div class="h-full bg-electric-cyan w-1/4 rounded-full relative">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
</div>
<div class="h-full bg-onyx w-1/4 rounded-full"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile flex flex-col pb-safe-bottom">
<!-- Header Section -->
<div class="mb-stack-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-inverse-on-surface mb-stack-sm">
                Your Lifestyle
            </h1>
<p class="font-body-md text-body-md text-outline-variant">
                Help us find flatmates who match your vibe. Select all that apply.
            </p>
</div>
<!-- Scrollable Options -->
<div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col gap-stack-xl pb-32">
<!-- Social Vibe Group -->
<section>
<h2 class="font-title-md text-title-md text-inverse-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">groups</span>
                    Social Vibe
                </h2>
<div class="flex flex-wrap gap-stack-sm">
<button class="chip-selected border border-electric-cyan rounded-full px-4 py-2 font-label-md text-label-md transition-all active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
                        Quiet &amp; Cozy
                    </button>
<button class="border border-outline-variant text-outline-variant hover:border-inverse-on-surface hover:text-inverse-on-surface rounded-full px-4 py-2 font-label-md text-label-md transition-all active:scale-95">
                        Dinner Parties
                    </button>
<button class="border border-outline-variant text-outline-variant hover:border-inverse-on-surface hover:text-inverse-on-surface rounded-full px-4 py-2 font-label-md text-label-md transition-all active:scale-95">
                        Always Out
                    </button>
<button class="border border-outline-variant text-outline-variant hover:border-inverse-on-surface hover:text-inverse-on-surface rounded-full px-4 py-2 font-label-md text-label-md transition-all active:scale-95">
                        Homebody
                    </button>
<button class="chip-selected border border-electric-cyan rounded-full px-4 py-2 font-label-md text-label-md transition-all active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
                        Movie Nights
                    </button>
</div>
</section>
<!-- Cleanliness Group -->
<section>
<h2 class="font-title-md text-title-md text-inverse-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">mop</span>
                    Cleanliness
                </h2>
<div class="flex flex-col gap-stack-sm">
<label class="flex items-center justify-between p-4 rounded-xl border border-onyx bg-surface-dim/5 hover:bg-surface-dim/10 cursor-pointer transition-colors">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-inverse-on-surface">Neat Freak</span>
<span class="font-body-md text-[14px] text-outline-variant">Spotless, always.</span>
</div>
<input class="w-5 h-5 text-electric-cyan bg-transparent border-outline-variant focus:ring-electric-cyan focus:ring-offset-deep-void" name="cleanliness" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-electric-cyan bg-electric-cyan/10 cursor-pointer transition-colors">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-electric-cyan">Tidy &amp; Respectful</span>
<span class="font-body-md text-[14px] text-outline-variant">Clean common areas.</span>
</div>
<input checked="" class="w-5 h-5 text-electric-cyan bg-transparent border-electric-cyan focus:ring-electric-cyan focus:ring-offset-deep-void" name="cleanliness" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-onyx bg-surface-dim/5 hover:bg-surface-dim/10 cursor-pointer transition-colors">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-inverse-on-surface">Lived-In</span>
<span class="font-body-md text-[14px] text-outline-variant">A bit of clutter is fine.</span>
</div>
<input class="w-5 h-5 text-electric-cyan bg-transparent border-outline-variant focus:ring-electric-cyan focus:ring-offset-deep-void" name="cleanliness" type="radio"/>
</label>
</div>
</section>
</div>

<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-gradient-to-t from-deep-void via-deep-void to-transparent pt-12 flex justify-center z-50">
<button class="w-full max-w-[350px] bg-electric-cyan text-on-primary-fixed hover:bg-primary-fixed transition-colors py-4 rounded-xl font-title-md text-title-md shadow-sm active:scale-95 flex items-center justify-center gap-2">
            Continue

</button>
</div>

<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] right-[-20%] w-[300px] h-[300px] bg-petrol/20 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[-10%] left-[-20%] w-[250px] h-[250px] bg-primary/20 rounded-full blur-[80px]"></div>
