<!DOCTYPE html>

<html class="dark" lang="en"><head>

                        "inverse-primary": "#81d1f0",

                        "surface-dim": "#dbdad7",
                        "on-primary-container": "#d3f1ff",
                        "on-primary-fixed-variant": "#004d62",
                        "sand-light": "#F7F5F2",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f2f0ed",
                        "secondary-container": "#e1dfde",
                        "primary-fixed-dim": "#81d1f0",
                        "surface-container-low": "#f5f3f0",

                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e5e2dc",
                        "error": "#ba1a1a",

<style>
        .chip {
            transition: all 0.2s ease-in-out;
        }
        .chip.selected {
            background-color: theme('colors.petrol');
            border-color: theme('colors.petrol');
            color: theme('colors.on-primary');
            box-shadow: 0 4px 12px rgba(14, 116, 144, 0.3);
            transform: translateY(-1px);
        }
        .glow-active {
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
        }
        body {
            background: radial-gradient(circle at top right, rgba(14, 116, 144, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(11, 17, 20, 1) 0%, rgba(29, 38, 43, 1) 100%);
            background-color: theme('colors.deep-void');
        }
    </style>
</head>
<body class="text-on-secondary font-body-md min-h-screen flex flex-col selection:bg-petrol selection:text-white antialiased overflow-x-hidden">
<!-- Top Navigation Area (Wizard style, no full app bar) -->
<header class="w-full px-margin-desktop py-8 flex justify-between items-center z-10 relative">
<!-- Progress Segments -->
<div class="flex gap-2 w-64 items-center">
<div class="h-1.5 flex-1 rounded-full bg-petrol transition-all duration-500"></div>
<div class="h-1.5 flex-1 rounded-full bg-petrol transition-all duration-500"></div>
<div class="h-1.5 flex-1 rounded-full bg-electric-cyan glow-active transition-all duration-500"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-variant/20 transition-all duration-500"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-variant/20 transition-all duration-500"></div>
<span class="ml-4 font-label-md text-label-md text-secondary-fixed-dim">3 of 5</span>
</div>
<!-- Skip Action -->
<button class="font-label-md text-label-md text-secondary-fixed-dim hover:text-white transition-colors duration-200">
            Skip for now
        </button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-desktop pb-24 z-10 relative">
<div class="w-full max-w-3xl space-y-stack-xl">
<!-- Header Texts -->
<div class="text-center space-y-stack-sm mb-12">
<h1 class="font-display-lg text-display-lg text-white tracking-tight">Define your vibe</h1>
<p class="font-body-lg text-body-lg text-tertiary-fixed-dim max-w-xl mx-auto">
                    Let's find flatmates who match your energy. Select the traits that best describe your lifestyle.
                </p>
</div>
<div class="bg-onyx/50 backdrop-blur-md rounded-[24px] p-10 border border-outline-variant/10 shadow-2xl space-y-12">
<!-- Category: Social -->
<section class="space-y-stack-md">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-electric-cyan text-2xl">celebration</span>
<h2 class="font-title-md text-title-md text-white">Social Energy</h2>
</div>
<div class="flex flex-wrap gap-3">
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Introvert
                        </button>
<button class="chip selected px-6 py-3 rounded-full border border-petrol text-on-primary font-label-md text-label-md">
                            Ambivert
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Extrovert
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Homebody
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Partygoer
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Weekend Warrior
                        </button>
</div>
</section>
<hr class="border-outline-variant/10"/>
<!-- Category: Cleanliness -->
<section class="space-y-stack-md">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-electric-cyan text-2xl">cleaning_services</span>
<h2 class="font-title-md text-title-md text-white">Cleanliness</h2>
</div>
<div class="flex flex-wrap gap-3">
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Neat Freak
                        </button>
<button class="chip selected px-6 py-3 rounded-full border border-petrol text-on-primary font-label-md text-label-md">
                            Tidy &amp; Organized
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Relaxed
                        </button>
<button class="chip px-6 py-3 rounded-full border border-outline-variant/30 text-secondary-fixed-dim hover:border-petrol hover:text-white font-label-md text-label-md bg-transparent">
                            Messy but clean
                        </button>
</div>
</section>
</div>
<!-- Footer Actions -->
<div class="flex justify-between items-center pt-8">
<button class="font-label-md text-label-md text-secondary-fixed-dim hover:text-white flex items-center gap-2 transition-colors duration-200">
<span class="material-symbols-outlined text-xl">arrow_back</span>
                    Back
                </button>
<button class="bg-petrol hover:bg-surface-tint text-on-primary px-10 py-4 rounded-xl font-title-md text-title-md shadow-[0_8px_24px_rgba(14,116,144,0.4)] transition-all duration-200 hover:-translate-y-1 active:scale-95 flex items-center gap-2">
                    Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Simple interaction script to toggle chip states
        document.querySelectorAll('.chip').forEach(button => {
            button.addEventListener('click', function() {
                // For this demo, allow multiple selections per category, 
                // toggle 'selected' class and adjust base classes.
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    this.classList.add('border-outline-variant/30', 'text-secondary-fixed-dim', 'bg-transparent');
                    this.classList.remove('border-petrol', 'text-on-primary');
                } else {
                    this.classList.add('selected');
                    this.classList.remove('border-outline-variant/30', 'text-secondary-fixed-dim', 'bg-transparent');
                }
            });
        });
    </script>
</body></html>
