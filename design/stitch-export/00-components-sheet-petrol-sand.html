<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Homley - UI Components Sheet (Petrol &amp; Sand)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#F7F5F2",
                        "surface-container-lowest": "#FFFFFF",
                        "tertiary-fixed": "#DFDCD6",
                        "on-surface": "#1D262B",
                        "primary": "#0E7490",
                        
                        "dark-surface": "#0B1114",
                        "dark-surface-container-lowest": "#151E24",
                        "dark-tertiary-fixed": "#2B3842",
                        "dark-on-surface": "#E5E9EC",
                        "dark-primary": "#22D3EE",
                        
                        // Mapping to design system logic
                        "on-surface-variant": "#444843",
                        "on-primary-container": "#7f897e",
                        "on-tertiary-container": "#898682",
                        "on-secondary-fixed-variant": "#464746",
                        "primary-fixed-dim": "#bfc9bd",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3f0ee",
                        "surface-container-low": "#f6f3f1",
                        "inverse-surface": "#30302f",
                        "error-container": "#ffdad6",
                        "surface-container": "#f0edeb",
                        "secondary": "#5e5e5d",
                        "secondary-fixed": "#e4e2e1",
                        "error": "#ba1a1a",
                        "success-tint": "#576158",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dcd9d8",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#eae8e6",
                        "on-primary-fixed": "#151e16",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#e1dfde",
                        "surface-bright": "#fcf9f7",
                        "inverse-primary": "#bfc9bd",
                        "on-tertiary-fixed": "#1c1c19",
                        "primary-fixed": "#dbe5d8",
                        "surface-variant": "#e5e2e0",
                        "tertiary": "#070705",
                        "surface-container-highest": "#e5e2e0",
                        "on-secondary-fixed": "#1b1c1b",
                        "outline": "#747873",
                        "secondary-fixed-dim": "#c7c6c5",
                        "on-primary-fixed-variant": "#404940",
                        "primary-container": "#182119",
                        "tertiary-container": "#201f1c",
                        "on-secondary-container": "#636362",
                        "surface-tint": "#576157",
                        "background": "#fcf9f7",
                        "outline-variant": "#c4c8c1",
                        "on-background": "#1b1c1b",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#c9c6c1",
                        "on-tertiary-fixed-variant": "#484743",
                        "success": "#10b981",
                        "warning": "#f59e0b"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "stack-xl": "48px",
                        "margin-desktop": "80px",
                        "container-max": "1280px",
                        "stack-xs": "4px"
                    },
                    fontFamily: {
                        "title-md": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "price-display": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "price-display": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }]
                    },
                    boxShadow: {
                        'whisper': '0px 2px 4px rgba(29, 38, 43, 0.04)',
                        'soft-pop': '0px 8px 24px rgba(29, 38, 43, 0.08)',
                        'dark-whisper': '0px 2px 4px rgba(0, 0, 0, 0.1)',
                        'dark-soft-pop': '0px 8px 24px rgba(0, 0, 0, 0.2)'
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill-icon { font-variation-settings: 'FILL' 1; }
        
        .light-theme { background-color: #F7F5F2; color: #1D262B; }
        .dark-theme { background-color: #0B1114; color: #E5E9EC; }
        
        /* Utility for displaying the grid */
        .component-grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .state-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .section-title { margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid currentColor; opacity: 0.2; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row">
<!-- LIGHT THEME CONTAINER -->
<div class="light-theme w-full md:w-1/2 p-margin-mobile md:p-margin-desktop overflow-y-auto border-r border-tertiary-fixed">
<header class="mb-stack-xl">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-stack-sm tracking-tight">Homley</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">UI Components Sheet • Light Theme (Petrol &amp; Sand)</p>
</header>
<!-- Buttons Section -->
<section class="mb-stack-xl">
<h2 class="font-title-md text-title-md mb-stack-md section-title">Buttons</h2>
<div class="space-y-stack-md">
<!-- Primary Button -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase tracking-wider">Primary (Petrol)</h3>
<div class="state-row">
<button class="bg-[#0E7490] text-white px-4 py-2 rounded-xl font-label-md text-label-md hover:bg-opacity-90 active:scale-95 transition-all shadow-whisper">Default</button>
<button class="bg-[#0E7490] bg-opacity-80 text-white px-4 py-2 rounded-xl font-label-md text-label-md shadow-whisper">Hover</button>
<button class="bg-[#0E7490] text-white px-4 py-2 rounded-xl font-label-md text-label-md opacity-50 cursor-not-allowed">Disabled</button>
<button class="bg-[#0E7490] text-white px-4 py-2 rounded-xl font-label-md text-label-md ring-2 ring-[#0E7490] ring-offset-2">Focused</button>
<button class="bg-[#0E7490] text-white px-4 py-2 rounded-xl font-label-md text-label-md flex items-center gap-2 opacity-80 cursor-wait">
<span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span> Busy
                        </button>
</div>
</div>
<!-- Outline Button -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase tracking-wider">Outline</h3>
<div class="state-row">
<button class="border border-[#DFDCD6] text-[#1D262B] px-4 py-2 rounded-xl font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all">Default</button>
</div>
</div>
<!-- Ghost Button -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase tracking-wider">Ghost</h3>
<div class="state-row">
<button class="text-[#0E7490] px-4 py-2 rounded-xl font-label-md text-label-md hover:bg-[#0E7490] hover:bg-opacity-10 active:scale-95 transition-all">Default</button>
</div>
</div>
<!-- Danger Button -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase tracking-wider">Danger</h3>
<div class="state-row">
<button class="bg-error text-white px-4 py-2 rounded-xl font-label-md text-label-md hover:bg-opacity-90 active:scale-95 transition-all shadow-whisper">Default</button>
</div>
</div>
</div>
</section>
<!-- Forms Section -->
<section class="mb-stack-xl">
<h2 class="font-title-md text-title-md mb-stack-md section-title">Forms</h2>
<div class="space-y-stack-md max-w-md">
<!-- Text Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs">Text Input</label>
<input class="w-full bg-surface-container-lowest border border-tertiary-fixed rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#0E7490] focus:border-transparent transition-all shadow-whisper placeholder-on-surface-variant" placeholder="Enter your name" type="text"/>
</div>
<!-- Search Box -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs">Search Box</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container-lowest border border-tertiary-fixed rounded-xl pl-12 pr-12 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#0E7490] focus:border-transparent transition-all shadow-soft-pop" placeholder="Search areas..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 bg-surface border border-tertiary-fixed rounded px-1.5 py-0.5 text-xs text-on-surface-variant font-medium">⌘K</div>
</div>
</div>
</div>
</section>
</div>
<!-- DARK THEME CONTAINER -->
<div class="dark-theme w-full md:w-1/2 p-margin-mobile md:p-margin-desktop overflow-y-auto">
<header class="mb-stack-xl">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-[#22D3EE] mb-stack-sm tracking-tight">Homley</h1>
<p class="font-body-lg text-body-lg text-gray-400">UI Components Sheet • Dark Theme (Petrol &amp; Sand)</p>
</header>
<!-- Buttons Section -->
<section class="mb-stack-xl">
<h2 class="font-title-md text-title-md mb-stack-md section-title border-gray-700">Buttons</h2>
<div class="space-y-stack-md">
<!-- Primary Button -->
<div>
<h3 class="font-label-md text-label-md text-gray-400 mb-stack-sm uppercase tracking-wider">Primary (Petrol)</h3>
<div class="state-row">
<button class="bg-[#22D3EE] text-[#0B1114] px-4 py-2 rounded-xl font-label-md text-label-md font-semibold hover:bg-opacity-90 active:scale-95 transition-all shadow-dark-whisper">Default</button>
<button class="bg-[#22D3EE] bg-opacity-80 text-[#0B1114] px-4 py-2 rounded-xl font-label-md text-label-md font-semibold shadow-dark-whisper">Hover</button>
<button class="bg-[#22D3EE] text-[#0B1114] px-4 py-2 rounded-xl font-label-md text-label-md font-semibold opacity-50 cursor-not-allowed">Disabled</button>
<button class="bg-[#22D3EE] text-[#0B1114] px-4 py-2 rounded-xl font-label-md text-label-md font-semibold ring-2 ring-[#22D3EE] ring-offset-2 ring-offset-[#0B1114]">Focused</button>
<button class="bg-[#22D3EE] text-[#0B1114] px-4 py-2 rounded-xl font-label-md text-label-md font-semibold flex items-center gap-2 opacity-80 cursor-wait">
<span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span> Busy
                        </button>
</div>
</div>
<!-- Outline Button -->
<div>
<h3 class="font-label-md text-label-md text-gray-400 mb-stack-sm uppercase tracking-wider">Outline</h3>
<div class="state-row">
<button class="border border-[#2B3842] text-[#E5E9EC] px-4 py-2 rounded-xl font-label-md text-label-md hover:bg-[#151E24] active:scale-95 transition-all">Default</button>
</div>
</div>
</div>
</section>
<!-- Forms Section -->
<section class="mb-stack-xl">
<h2 class="font-title-md text-title-md mb-stack-md section-title border-gray-700">Forms</h2>
<div class="space-y-stack-md max-w-md">
<!-- Text Input -->
<div>
<label class="block font-label-md text-label-md text-[#E5E9EC] mb-stack-xs">Text Input</label>
<input class="w-full bg-[#151E24] border border-[#2B3842] rounded-xl px-4 py-3 font-body-md text-body-md text-[#E5E9EC] focus:outline-none focus:ring-2 focus:ring-[#22D3EE] focus:border-transparent transition-all shadow-dark-whisper placeholder-gray-500" placeholder="Enter your name" type="text"/>
</div>
<!-- Search Box -->
<div>
<label class="block font-label-md text-label-md text-[#E5E9EC] mb-stack-xs">Search Box</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">search</span>
<input class="w-full bg-[#151E24] border border-[#2B3842] rounded-xl pl-12 pr-12 py-3 font-body-md text-body-md text-[#E5E9EC] focus:outline-none focus:ring-2 focus:ring-[#22D3EE] focus:border-transparent transition-all shadow-dark-soft-pop placeholder-gray-500" placeholder="Search areas..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 bg-[#2B3842] border border-gray-700 rounded px-1.5 py-0.5 text-xs text-gray-300 font-medium">⌘K</div>
</div>
</div>
</div>
</section>
</div>
</body></html>
