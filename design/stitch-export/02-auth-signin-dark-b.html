<body class="flex flex-col items-center justify-center p-margin-mobile relative min-h-screen">

<!-- Main Container Card -->

<!-- Header -->

<h1 class="font-display-lg-mobile text-display-lg-mobile text-inverse-on-surface mb-stack-xs">Homley</h1>
<p class="font-body-md text-body-md text-outline-variant">Welcome back. Enter your details.</p>
</div>
<!-- Toggle: Email / Phone -->
<div class="flex bg-deep-void rounded-lg p-1 mb-stack-lg border border-outline-variant/20">
<button class="flex-1 py-2 rounded-md font-label-md text-label-md bg-onyx text-inverse-on-surface shadow-sm transition-colors">
                Email

<button class="flex-1 py-2 rounded-md font-label-md text-label-md text-outline-variant hover:text-inverse-on-surface transition-colors">
                Phone

</div>
<!-- Input Area (Email Active) -->
<div class="flex flex-col gap-stack-sm mb-stack-lg">
<label class="font-label-md text-label-md text-inverse-on-surface pl-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-deep-void border border-outline-variant/30 rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-inverse-on-surface placeholder-outline-variant/50 focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan focus:outline-none transition-all" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- OTP Input Area (Simulated next step) -->
<!-- In a real app this would toggle visibility. Showing it here to fulfill prompt requirements. -->
<div class="flex flex-col gap-stack-sm mb-stack-lg hidden" id="otp-section">
<label class="font-label-md text-label-md text-inverse-on-surface pl-1">Enter 6-digit OTP</label>
<div class="flex justify-between gap-2">
<input class="w-12 h-14 bg-deep-void border border-outline-variant/30 rounded-lg text-center font-title-md text-title-md text-inverse-on-surface focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan focus:outline-none transition-all" maxlength="1" type="number"/>
<input class="w-12 h-14 bg-deep-void border border-outline-variant/30 rounded-lg text-center font-title-md text-title-md text-inverse-on-surface focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan focus:outline-none transition-all" maxlength="1" type="number"/>
<input class="w-12 h-14 bg-deep-void border border-outline-variant/30 rounded-lg text-center font-title-md text-title-md text-inverse-on-surface focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan focus:outline-none transition-all" maxlength="1" type="number"/>

<input class="w-12 h-14 bg-deep-void border border-outline-variant/30 rounded-lg text-center font-title-md text-title-md text-inverse-on-surface focus:border-electric-cyan focus:ring-1 focus:ring-electric-cyan focus:outline-none transition-all" maxlength="1" type="number"/>

            Continue with Google

<p class="font-body-md text-body-md text-outline-variant text-center mt-stack-lg text-[12px]">
            By continuing, you agree to our <a class="text-electric-cyan hover:underline" href="#">Terms of Service</a> and <a class="text-electric-cyan hover:underline" href="#">Privacy Policy</a>.
        </p>
</div>
<script>
        // Simple script to handle OTP input focus flow for demonstration
        const otpInputs = document.querySelectorAll('#otp-section input');
        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Toggle logic for demo purposes (clicking email/phone buttons)
        const toggleButtons = document.querySelectorAll('.bg-deep-void.rounded-lg.p-1 > button');
        toggleButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                toggleButtons.forEach(b => {
                    b.classList.remove('bg-onyx', 'text-inverse-on-surface', 'shadow-sm');
                    b.classList.add('text-outline-variant');
                });
                this.classList.add('bg-onyx', 'text-inverse-on-surface', 'shadow-sm');
                this.classList.remove('text-outline-variant');
                
                // In a real app, this would switch the input fields below
            });
        });
    </script>
